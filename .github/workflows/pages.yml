name: Check & deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # the effect registry must match the vendored PixelFX tree
      - run: npm run registry && git diff --exit-code src/fx/registry.gen.js
      # skills: passives, cast counters and whole runs, on the real game modules
      - run: npm test
      # every one of the 244 effects loads, draws, stays in bounds and ends
      - run: npm run smoke
      - run: npm run audit
      - run: npm run build
      # Fast real-browser checks: input boundaries, settings, touch menus and failed production chunks.
      # ubuntu-24.04 already provides Chromium's runtime libraries; the game's font is bundled.
      # Avoid an apt refresh for extra font packages, which can stall on the runner's Ubuntu mirror.
      - run: npx playwright-core install chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
