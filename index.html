<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07050b" />
    <title>FX Rush</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2307050b'/%3E%3Cpath d='M1 6h1V5h1V4h1V3h1V2h1V1h1v2H6v1H5v1H4v1H3v1H1z' fill='%23ffc65a'/%3E%3Cpath d='M1 6h1v1H1z' fill='%23ff4d6d'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #07050b; overflow: hidden; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; outline: none; touch-action: none; }
      noscript { color: #f4ecdc; font: 14px sans-serif; display: block; padding: 2em; }
    </style>
  </head>
  <body>
    <canvas id="game" width="320" height="180" tabindex="0"></canvas>
    <noscript>FX Rush 需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
